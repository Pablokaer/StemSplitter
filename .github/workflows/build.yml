name: Build desktop apps

on:
  push:
    branches: ["**"]      # every commit is built + self-tested, so a broken build shows up right away
    tags: ["v*"]          # push a tag like v1.0.0 -> builds + GitHub Release with the downloads
    paths-ignore:         # (not applied to tags) docs-only commits can't break the build
      - "**.md"
      - "tools/**"
  pull_request:           # only builds PRs from forks; same-repo branches are already built on push
    paths-ignore:
      - "**.md"
      - "tools/**"
  workflow_dispatch:      # or run it by hand from the Actions tab
    inputs:
      cpu_only:
        description: "Also build a small CPU-only Windows version (~0.5 GB, for PCs without an NVIDIA GPU)"
        type: boolean
        default: false

permissions:
  contents: write

# a newer commit on the same branch cancels the build still running for the old one (never for tags)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    # fast check (~30 s) so syntax errors / undefined names fail before the long builds start
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (pyflakes + syntax errors, see ruff.toml)
        run: pipx run ruff==0.16.9 check --output-format=github .
      - name: Byte-compile
        run: python -m compileall -q main.py stemsplitter StemSplitter.spec
      - name: Updater tests (standard library only)
        run: python -m unittest discover -s tests -p test_updater.py -v
      - name: Check the tag matches the app version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: python -m stemsplitter.release check-version "$GITHUB_REF_NAME"
      - name: Create the draft release (tags only)
        # a draft is invisible to the apps' update check until the publish job below makes it public,
        # so nobody is offered a release whose files for their platform are still being built
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "StemSplitter ${GITHUB_REF_NAME#v}"

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            # CUDA build: uses the NVIDIA GPU when there is one and falls back to the CPU otherwise
            torch_index: https://download.pytorch.org/whl/cu130
          - name: macOS-AppleSilicon
            os: macos-latest
            torch_index: ""          # default macOS wheel already includes Metal (MPS) GPU support
          - name: Windows-x64-CPU
            os: windows-latest
            torch_index: https://download.pytorch.org/whl/cpu
            optional: true
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - name: Skip optional CPU-only build unless requested
        id: gate
        shell: bash
        run: |
          if [[ "${{ matrix.optional }}" == "true" && "${{ github.event.inputs.cpu_only }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          if [[ -n "${{ matrix.torch_index }}" ]]; then
            # swap in the requested PyTorch build (CPU-only or CUDA), same version
            TORCH_VER=$(python -c "import torch; print(torch.__version__.split('+')[0])")
            pip install --force-reinstall --no-deps "torch==${TORCH_VER}" --index-url "${{ matrix.torch_index }}"
          fi
          pip uninstall -y torchaudio || true
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Build with PyInstaller
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          STEMSPLITTER_PLATFORM: ${{ matrix.name }}   # written into the build: the app finds its update files by it
        run: pyinstaller --noconfirm StemSplitter.spec

      - name: Self-test packaged app (Windows)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\StemSplitter\StemSplitter.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\StemSplitter\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Sign ad-hoc + self-test packaged app (macOS)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/StemSplitter.app
          code=0
          dist/StemSplitter.app/Contents/MacOS/StemSplitter --selftest > selftest-output.txt 2>&1 || code=$?
          cat selftest-output.txt
          data="$HOME/Library/Application Support/StemSplitter"
          cat "$data/selftest.txt" || true
          if [[ $code -ne 0 ]]; then
            # an annotation (unlike the job log) can be read without signing in to GitHub
            python - "$code" "$data/selftest.txt" selftest-output.txt "$data/stemsplitter.log" <<'PY'
          import sys
          from pathlib import Path
          parts = [f"exit code {sys.argv[1]}"]
          for p in map(Path, sys.argv[2:]):
              if p.is_file():
                  parts.append(f"--- {p.name} ---\n" + p.read_text(errors="replace")[-6000:])
          msg = "\n".join(parts)
          print("::error title=macOS self-test failed::" + msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          fi
          exit $code

      - name: Package (Windows)
        # a zip cut in 1.9 GB parts (.zip.001, .002, …): GitHub Releases reject files over 2 GB and the CUDA build
        # is bigger. 7-Zip opens the parts directly, and the app's updater reads them with range requests.
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip -mm=Deflate -mx=5 -v1900m "release\StemSplitter-${{ matrix.name }}.zip" .\dist\StemSplitter

      - name: Package (macOS)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/StemSplitter.app "release/StemSplitter-${{ matrix.name }}.zip"

      - name: File index for the updater
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          build=dist/StemSplitter
          if [[ "$RUNNER_OS" == "macOS" ]]; then build=dist/StemSplitter.app; fi
          python -m stemsplitter.release index "$build" --platform "${{ matrix.name }}" -o release

      - name: Check the archive with the updater's own code
        # installs the build from the archive into an empty folder, then damages that copy and updates it again
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: python -m stemsplitter.release verify "release/StemSplitter-${{ matrix.name }}.files.json" --into verify

      - name: Self-test the copy installed from the archive (Windows)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "verify\StemSplitter\StemSplitter.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\StemSplitter\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self-test the copy installed from the archive (macOS)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          code=0
          verify/StemSplitter.app/Contents/MacOS/StemSplitter --selftest > verify-output.txt 2>&1 || code=$?
          cat verify-output.txt
          cat "$HOME/Library/Application Support/StemSplitter/selftest.txt" || true
          if [[ $code -ne 0 ]]; then
            echo "::error title=macOS self-test of the copy installed from the archive failed::exit code $code"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        # branch builds only need to pass; downloads are kept for releases and manual runs
        if: steps.gate.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: StemSplitter-${{ matrix.name }}
          path: release/
          compression-level: 0
          retention-days: 30

      - name: Attach to the draft release
        if: steps.gate.outputs.skip != 'true' && !matrix.optional && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  publish:
    # only when every build passed: until then the release stays a draft that no app is offered
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
